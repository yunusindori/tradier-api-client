name: Publish to PyPI (release)

on:
  push:
    branches: [release]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: publish-pypi-release
  cancel-in-progress: false

jobs:
  publish:
    name: Build & publish to PyPI
    runs-on: ubuntu-latest

    # Only run on merge commits (i.e., after a PR merge into release).
    # This avoids publishing on direct pushes.
    if: startsWith(github.event.head_commit.message, 'Merge pull request')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tooling
        run: |
          python -m pip install -U pip
          python -m pip install build twine

      - name: Build distributions
        run: python -m build

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          python -m twine upload dist/*

  open_pr:
    name: Open PR release -> main
    runs-on: ubuntu-latest
    needs: publish

    # Only after successful publish job (and only on merge commits)
    if: needs.publish.result == 'success'

    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.PR_BOT_APP_ID }}
          private-key: ${{ secrets.PR_BOT_APP_PRIVATE_KEY }}

      - name: Create PR (release -> main)
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ steps.app-token.outputs.token }}
          base: main
          branch: automation/release-to-main
          title: "Release: merge release into main"
          body: "Automated PR created after successful publish to PyPI from release."
          commit-message: "chore: prepare main branch"
          labels: automated
          delete-branch: true
          update-branch: true
