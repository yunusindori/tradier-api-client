name: Publish to PyPI (release)

on:
  push:
    branches: [release]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: publish-pypi-release
  cancel-in-progress: false

jobs:
  publish:
    name: Build & publish to PyPI
    runs-on: ubuntu-latest

    # Only run on merge commits (i.e., after a PR merge into release).
    # This avoids publishing on direct pushes.
    if: startsWith(github.event.head_commit.message, 'Merge pull request')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tooling
        run: |
          python -m pip install -U pip
          python -m pip install build twine

      - name: Build distributions
        run: python -m build

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          python -m twine upload dist/*

  open_pr:
    name: Open PR release -> main
    runs-on: ubuntu-latest
    needs: publish

    # Only after successful publish job (and only on merge commits)
    if: needs.publish.result == 'success'

    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.PR_BOT_APP_ID }}
          private-key: ${{ secrets.PR_BOT_APP_PRIVATE_KEY }}

      - name: Create or update PR (release -> main)
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const base = 'main';
            const head = 'release';

            const title = 'Release: merge release into main';
            const body = [
              'Automated PR created after a successful publish to PyPI from release.',
              '',
              'Merge this PR to bring the release branch back into main.'
            ].join('\n');

            // Look for an existing open PR from release -> main
            const { data: pulls } = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              base,
              per_page: 100,
            });

            const existing = pulls.find(pr => pr.head && pr.head.ref === head);

            if (existing) {
              core.info(`PR already exists: #${existing.number} ${existing.html_url}`);
              await github.rest.pulls.update({
                owner,
                repo,
                pull_number: existing.number,
                title,
                body,
              });
              return;
            }

            try {
              const { data: pr } = await github.rest.pulls.create({
                owner,
                repo,
                title,
                head,
                base,
                body,
                maintainer_can_modify: true,
              });
              core.info(`Created PR: #${pr.number} ${pr.html_url}`);
            } catch (e) {
              if (e.status === 422) {
                core.warning(`No PR created: '${head}' has no changes compared to '${base}'. (${e.message})`);
                return;
              }
              throw e;
            }
