name: Publish to PyPI (release)

on:
  push:
    branches: [release]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: publish-pypi-release
  cancel-in-progress: false

jobs:
  publish:
    name: Build & publish to PyPI
    runs-on: ubuntu-latest

    # Only run on merge commits (i.e., after a PR merge into release).
    # This avoids publishing on direct pushes.
    if: startsWith(github.event.head_commit.message, 'Merge pull request')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tooling
        run: |
          python -m pip install -U pip
          python -m pip install build twine

      - name: Build distributions
        run: python -m build

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          python -m twine upload dist/*

  open_pr:
    name: Open PR release -> main
    runs-on: ubuntu-latest
    needs: publish

    # Only after successful publish job (and only on merge commits)
    if: needs.publish.result == 'success'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create or update PR (release -> main)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr list --head release --base main --state open --json number --jq '.[0].number' > pr.txt || true
          PR_NUMBER=$(cat pr.txt)
          if [ -n "$PR_NUMBER" ] && [ "$PR_NUMBER" != "null" ]; then
            echo "PR already open: #$PR_NUMBER"
            exit 0
          fi

          gh pr create \
            --base main \
            --head release \
            --title "Release: merge release into main" \
            --body "Automated PR created after successful publish to PyPI from release."
