name: Publish to TestPyPI (develop)

on:
  push:
    branches: [develop]

permissions:
  contents: write
  pull-requests: write
  id-token: write
  pages: write

concurrency:
  group: publish-testpypi-develop
  cancel-in-progress: false

jobs:
  publish:
    name: Build & publish to TestPyPI
    runs-on: ubuntu-latest

    # Only run on merge commits (i.e., after a PR merge into develop).
    # This avoids publishing on direct pushes.
    if: startsWith(github.event.head_commit.message, 'Merge pull request')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tooling
        run: |
          python -m pip install -U pip
          python -m pip install build twine

      - name: Build distributions
        run: python -m build

      - name: Publish to TestPyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TEST_PYPI_API_TOKEN }}
        run: |
          python -m twine upload --repository-url https://test.pypi.org/legacy/ dist/*

  open_pr:
    name: Open PR develop -> release
    runs-on: ubuntu-latest
    needs: publish

    # Only after successful publish job (and only on merge commits)
    if: needs.publish.result == 'success'

    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.PR_BOT_APP_ID }}
          private-key: ${{ secrets.PR_BOT_APP_PRIVATE_KEY }}

      - name: Checkout develop (with PR bot token)
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: develop
          fetch-depth: 0

      - name: Ensure base branch (release) is fetched
        run: |
          git fetch --no-tags --prune --progress origin release:refs/remotes/origin/release

      - name: Debug PR source/base state
        shell: bash
        run: |
          set -euo pipefail
          echo "== Local state =="
          echo "HEAD branch: $(git symbolic-ref -q --short HEAD || echo '(detached)')"
          echo "HEAD sha:    $(git rev-parse HEAD)"
          echo
          echo "== Remote-tracking refs =="
          echo "origin/develop: $(git rev-parse refs/remotes/origin/develop)"
          echo "origin/release: $(git rev-parse refs/remotes/origin/release)"
          echo "merge-base:    $(git merge-base refs/remotes/origin/release refs/remotes/origin/develop)"
          echo
          echo "== Ahead/behind (release...develop) =="
          git rev-list --left-right --count refs/remotes/origin/release...refs/remotes/origin/develop
          echo
          echo "== Files changed (release..develop) =="
          git diff --name-status refs/remotes/origin/release..refs/remotes/origin/develop || true
          echo
          echo "== Last 5 commits =="
          echo "-- origin/develop --"
          git --no-pager log --oneline -5 refs/remotes/origin/develop
          echo "-- origin/release --"
          git --no-pager log --oneline -5 refs/remotes/origin/release

      - name: Create PR (develop -> release)
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ steps.app-token.outputs.token }}
          base: release
          branch: automation/develop-to-release
          title: "Release: merge develop into release"
          body: |
            Automated PR created after a successful publish to TestPyPI from develop.

            Merge this PR when you've finished testing the TestPyPI build.
          commit-message: "chore: prepare release branch"
          labels: automated
          delete-branch: true
