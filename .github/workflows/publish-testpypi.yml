name: Publish to TestPyPI (develop)

on:
  push:
    branches: [develop]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: publish-testpypi-develop
  cancel-in-progress: false

jobs:
  publish:
    name: Build & publish to TestPyPI
    runs-on: ubuntu-latest

    # Only run on merge commits (i.e., after a PR merge into develop).
    # This avoids publishing on direct pushes.
    if: startsWith(github.event.head_commit.message, 'Merge pull request')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python_version: '3.11'

      - name: Install build tooling
        run: |
          python -m pip install -U pip
          python -m pip install build twine

      - name: Build distributions
        run: python -m build

      - name: Publish to TestPyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TEST_PYPI_API_TOKEN }}
        run: |
          python -m twine upload --repository-url https://test.pypi.org/legacy/ dist/*

  open_pr:
    name: Open PR develop -> release
    runs-on: ubuntu-latest
    needs: publish

    # Only after successful publish job (and only on merge commits)
    if: needs.publish.result == 'success'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create or update PR (develop -> release)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr list --head develop --base release --state open --json number --jq '.[0].number' > pr.txt || true
          PR_NUMBER=$(cat pr.txt)
          if [ -n "$PR_NUMBER" ] && [ "$PR_NUMBER" != "null" ]; then
            echo "PR already open: #$PR_NUMBER"
            exit 0
          fi

          gh pr create \
            --base release \
            --head develop \
            --title "Release: merge develop into release" \
            --body "Automated PR created after successful publish to TestPyPI from develop."
